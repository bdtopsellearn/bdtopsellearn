<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Admin | Full Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: #000; color: white; overflow-x: hidden; touch-action: pan-x pan-y; }

        /* 1. Login Screen */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at bottom, #001f3f 0%, #000 100%); display: flex; justify-content: center; align-items: center; z-index: 100000; }
        .login-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 85%; max-width: 350px; text-align: center; }

        #main-dashboard { display: none; }

        /* Jikimiki Background */
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.5); opacity: 1; } }

        .header { background: rgba(0,0,0,0.85); padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); font-weight: bold; color: var(--primary); letter-spacing: 2px; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .container { padding: 15px; margin-bottom: 90px; }
        .section { display: none; animation: slideUp 0.4s ease; }
        .active-section { display: block; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* User Card */
        .user-card { background: rgba(255, 255, 255, 0.08); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; border-left: 4px solid var(--primary); }
        .user-card img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        
        /* Withdrawal Card with Colored Buttons */
        .req-card { border-left: 5px solid gold; background: rgba(255,255,255,0.08); padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .method-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .method-logo { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .approve-btn { background: #28a745 !important; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .reject-btn { background: #dc3545 !important; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }

        /* Form Controls */
        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .glass-input { background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; width: 100%; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 13px; }
        .btn-action { background: linear-gradient(45deg, var(--primary), var(--secondary)); border: none; color: white; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-action:disabled { background: #222; color: #555; cursor: not-allowed; }

        /* Multi-Link UI */
        .link-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .link-row input { margin-bottom: 0 !important; }

        /* YouTube Style Card */
        .yt-card { background: rgba(255, 255, 255, 0.03); border-radius: 12px; overflow: hidden; border: 1px solid #222; margin-bottom: 20px; }
        .yt-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .yt-info { padding: 12px; }
        .yt-actions { display: flex; justify-content: space-between; border-top: 1px solid #222; padding-top: 10px; align-items: center; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { color: #666; text-align: center; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }

        #edit-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>

<!-- 1. Login Section -->
<div id="login-screen">
    <div class="login-box">
        <i class="fas fa-user-shield" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
        <h2>Admin Login</h2>
        <input type="text" id="adm-user" class="glass-input" placeholder="Username">
        <input type="password" id="adm-pass" class="glass-input" placeholder="Password">
        <button class="btn-action" style="width: 100%;" onclick="handleLogin()">Login</button>
    </div>
</div>

<!-- 2. Main Dashboard -->
<div id="main-dashboard">
    <div class="background-container" id="stars-bg"></div>
    <div class="header">MASTER CONTROL PANEL</div>

    <div class="container">
        <!-- Section: Users -->
        <div id="users" class="section active-section">
            <h3 style="color:var(--primary);">Managed Users</h3>
            <div id="user-list">Loading...</div>
        </div>

        <!-- Section: Upload & Pending Requests -->
        <div id="upload" class="section">
            <h3 style="color:gold;"><i class="fas fa-money-bill-transfer"></i> Pending Requests</h3>
            <div id="requests-list">No pending payments.</div>

            <h3 style="color:var(--primary); margin-top:30px;"><i class="fas fa-plus-circle"></i> Create Post</h3>
            <div class="glass-card">
                <input type="text" id="fn" class="glass-input" placeholder="Project Title" oninput="valUpload()">
                <input type="text" id="ft" class="glass-input" placeholder="Thumbnail URL" oninput="valUpload()">
                <textarea id="fd" class="glass-input" style="height:60px;" placeholder="Description" oninput="valUpload()"></textarea>
                
                <select id="fcat" class="glass-input" onchange="toggleUploadType()">
                    <option value="">Select Category</option>
                    <option value="normal">Normal (Ads)</option>
                    <option value="premium">Premium (Paid)</option>
                </select>

                <div id="normal-inputs" style="display:none;">
                    <input type="number" id="ads_c" class="glass-input" placeholder="Ads Count" oninput="valUpload()">
                    <input type="number" id="ads_t" class="glass-input" placeholder="Timer (Max 30s)" oninput="checkAdsTime(this)">
                </div>

                <div id="premium-inputs" style="display:none;">
                    <input type="number" id="f_price" class="glass-input" placeholder="Price (BDT)" oninput="valUpload()">
                </div>

                <div id="multi-link-area">
                    <div class="link-row">
                        <input type="text" class="ln glass-input" placeholder="File Name" style="flex:1;"><input type="text" class="lu glass-input" placeholder="URL" style="flex:2;">
                    </div>
                </div>
                <button onclick="addLRow()" style="background:none; border:1px dashed var(--primary); width:100%; color:var(--primary); padding:10px; border-radius:10px; margin-bottom:15px; cursor:pointer;">+ Add Another Link</button>

                <input type="number" id="flim" class="glass-input" value="0" placeholder="Limit">
                <button id="pub-btn" class="btn-action" onclick="publish()" disabled style="width:100%;">PUBLISH</button>
            </div>
        </div>

        <!-- Section: Content Inventory -->
        <div id="content" class="section">
            <h3 style="color:var(--primary);">Manage Content</h3>
            <div id="inventory-grid" style="display:grid; grid-template-columns:1fr; gap:15px;"></div>
        </div>

        <!-- Section: Settings -->
        <div id="settings" class="section">
            <h3 style="color:var(--primary);">Bot Settings</h3>
            <div class="glass-card">
                <input type="text" id="s_bot" class="glass-input" placeholder="Bot Token" oninput="valSet()">
                <input type="text" id="s_chan" class="glass-input" placeholder="Channel Link" oninput="valSet()">
                <input type="text" id="s_grp" class="glass-input" placeholder="Group Link" oninput="valSet()">
                <input type="text" id="s_ad" class="glass-input" placeholder="Monetag Zone ID" oninput="valSet()">
                <button id="save-sets-btn" class="btn-action" onclick="saveSets()" disabled style="width:100%;">SAVE SETTINGS</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="nav">
        <div class="nav-item active" onclick="navTo('users',this)"><i class="fas fa-users"></i>USERS</div>
        <div class="nav-item" onclick="navTo('upload',this)"><i class="fas fa-upload"></i>UPLOAD</div>
        <div class="nav-item" onclick="navTo('content',this)"><i class="fas fa-play-circle"></i>CONTENT</div>
        <div class="nav-item" onclick="navTo('settings',this)"><i class="fas fa-cog"></i>SETTINGS</div>
    </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal">
    <div class="glass-card" style="width:100%; max-width:400px; border:1px solid var(--primary);">
        <h3>Edit Data</h3>
        <input type="hidden" id="e_id">
        <input type="text" id="e_title" class="glass-input">
        <textarea id="e_desc" class="glass-input"></textarea>
        <input type="text" id="e_thumb" class="glass-input">
        <select id="e_type" class="glass-input" onchange="toggleEditFields()">
            <option value="normal">Normal</option>
            <option value="premium">Premium</option>
        </select>
        <div id="e_norm_sec">
            <input type="number" id="e_ads_c" class="glass-input" placeholder="Ads Count">
            <input type="number" id="e_ads_t" class="glass-input" placeholder="Ads Timer">
        </div>
        <div id="e_prem_sec" style="display:none;">
            <input type="number" id="e_price" class="glass-input" placeholder="Price">
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-action" onclick="saveEdit()" style="flex:1">SAVE</button>
            <button class="btn-action" onclick="closeEdit()" style="flex:1; background:#444">CANCEL</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCSDfYztapzwaVgFDUqMnI84fHevaR6mww",
        authDomain: "au-bot-4f5f0.firebaseapp.com",
        databaseURL: "https://au-bot-4f5f0-default-rtdb.firebaseio.com",
        projectId: "au-bot-4f5f0",
        appId: "1:1098494913501:web:65517323172ec1af732434"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const bKLogo = "https://i.postimg.cc/7Zt656YX/images.webp";
    const nGLogo = "https://i.postimg.cc/HWbV6dBJ/images-(1).jpg";

    window.handleLogin = () => {
        if(document.getElementById('adm-user').value === 'admin' && document.getElementById('adm-pass').value === '1234') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            startLive();
        } else { alert("Invalid Credentials!"); }
    };

    let initialSets = {};
    function startLive() {
        // Load Settings
        get(ref(db, 'settings')).then(s => {
            if(s.exists()){
                initialSets = s.val();
                document.getElementById('s_bot').value = initialSets.bot_token || "";
                document.getElementById('s_chan').value = initialSets.chan_link || "";
                document.getElementById('s_grp').value = initialSets.grp_link || "";
                document.getElementById('s_ad').value = initialSets.ad_tag || "";
            }
        });

        // Load Users
        onValue(ref(db, 'users'), snap => {
            const div = document.getElementById('user-list');
            div.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach(uid => {
                const p = snap.val()[uid].profile || {};
                const isB = p.isBlocked || false;
                div.innerHTML += `<div class="user-card" style="border-left-color:${isB?'red':'#00ff00'}"><img src="${p.photo_url || 'https://via.placeholder.com/60'}"><div class="user-details"><h4>${p.first_name || 'User'}</h4><p>ID: ${uid}</p><button style="background:${isB?'#00ff00':'#ff4d4d'}; border:none; color:${isB?'black':'white'}; padding:5px 10px; border-radius:8px; font-size:10px; cursor:pointer;" onclick="toggleBlock('${uid}', ${isB})">${isB?'UNBLOCK':'BLOCK'}</button></div></div>`;
            });
        });

        // Load Requests (Pending Only)
        onValue(ref(db, 'requests'), snap => {
            const div = document.getElementById('requests-list');
            div.innerHTML = "";
            const data = snap.val();
            let count = 0;
            if(data) Object.keys(data).forEach(rid => {
                const r = data[rid];
                if(r.status === 'pending') {
                    count++;
                    div.innerHTML += `
                    <div class="req-card">
                        <div class="method-header"><span><b>User:</b> ${r.userId}</span><img src="${r.method==='bkash'?bKLogo:nGLogo}" class="method-logo"></div>
                        <div style="font-size:14px; margin:5px 0;"><b>Trx ID:</b> <span style="color:cyan">${r.trxId}</span></div>
                        <div style="font-size:12px;"><b>Amt:</b> ${r.amount} | <b>File:</b> ${r.fileName}</div>
                        <div class="btn-group">
                            <button class="approve-btn" onclick="updateStatus('${rid}', 'approved')">APPROVE</button>
                            <button class="reject-btn" onclick="updateStatus('${rid}', 'rejected')">REJECT</button>
                        </div>
                    </div>`;
                }
            });
            if(count === 0) div.innerHTML = "No pending requests.";
        });

        // Load Content
        onValue(ref(db, 'files'), snap => {
            const div = document.getElementById('inventory-grid');
            div.innerHTML = "";
            if(snap.val()) Object.keys(snap.val()).forEach(id => {
                const f = snap.val()[id];
                div.innerHTML += `<div class="yt-card"><img src="${f.thumbnail}" class="yt-thumb"><div class="yt-info"><div><b>${f.name}</b></div><div style="display:flex; gap:15px; margin-top:10px;"><i class="fas fa-edit" style="color:var(--primary); cursor:pointer; font-size:18px;" onclick='openEdit("${id}", ${JSON.stringify(f)})'></i><i class="fas fa-trash" style="color:red; cursor:pointer; font-size:18px;" onclick="delPost('${id}')"></i></div></div></div>`;
            });
        });
    }

    // Logic
    window.toggleUploadType = () => {
        const t = document.getElementById('fcat').value;
        document.getElementById('normal-inputs').style.display = t === 'normal' ? 'block' : 'none';
        document.getElementById('premium-inputs').style.display = t === 'premium' ? 'block' : 'none';
        valUpload();
    };

    window.checkAdsTime = (el) => { if(el.value > 30) el.style.border = '2px solid red'; else el.style.border = '1px solid #444'; valUpload(); };

    window.valUpload = () => {
        const t = document.getElementById('fn').value, th = document.getElementById('ft').value, cat = document.getElementById('fcat').value, atm = document.getElementById('ads_t').value;
        let ok = t && th && cat;
        if(cat==='normal') ok = ok && document.getElementById('ads_c').value && atm && atm <= 30;
        if(cat==='premium') ok = ok && document.getElementById('f_price').value;
        document.getElementById('pub-btn').disabled = !ok;
    };

    window.publish = () => {
        let links = []; document.querySelectorAll('.link-row').forEach(r => {
            const n = r.querySelector('.ln').value, u = r.querySelector('.lu').value;
            if(n && u) links.push({name:n, url:u});
        });
        push(ref(db, 'files'), { name: document.getElementById('fn').value, thumbnail: document.getElementById('ft').value, description: document.getElementById('fd').value, type: document.getElementById('fcat').value, ads_count: parseInt(document.getElementById('ads_c').value)||0, ads_time: parseInt(document.getElementById('ads_t').value)||0, price: parseInt(document.getElementById('f_price').value)||0, download_limit: parseInt(document.getElementById('flim').value)||0, links: links, timestamp: Date.now() });
        alert("Published!"); location.reload();
    };

    window.valSet = () => {
        const b = document.getElementById('s_bot').value, c = document.getElementById('s_chan').value, g = document.getElementById('s_grp').value, a = document.getElementById('s_ad').value;
        document.getElementById('save-sets-btn').disabled = !(b && c && g && a && (b !== initialSets.bot_token || c !== initialSets.chan_link || g !== initialSets.grp_link || a !== initialSets.ad_tag));
    };

    window.saveSets = () => {
        const data = { bot_token: document.getElementById('s_bot').value, chan_link: document.getElementById('s_chan').value, grp_link: document.getElementById('s_grp').value, ad_tag: document.getElementById('s_ad').value };
        set(ref(db, 'settings'), data).then(() => { alert("Saved!"); initialSets = data; document.getElementById('save-sets-btn').disabled = true; });
    };

    window.updateStatus = (rid, status) => update(ref(db, `requests/${rid}`), { status }).then(() => alert("Request " + status));
    window.toggleBlock = (uid, s) => update(ref(db, `users/${uid}/profile`), {isBlocked: !s});
    window.delPost = id => { if(confirm("Delete?")) remove(ref(db, `files/${id}`)); };

    window.openEdit = (id, f) => {
        document.getElementById('e_id').value = id; document.getElementById('e_title').value = f.name; document.getElementById('e_desc').value = f.description;
        document.getElementById('e_thumb').value = f.thumbnail; document.getElementById('e_type').value = f.type;
        document.getElementById('e_ads_c').value = f.ads_count; document.getElementById('e_ads_t').value = f.ads_time;
        document.getElementById('e_price').value = f.price; toggleEditFields(); document.getElementById('edit-modal').style.display='flex';
    };
    window.toggleEditFields = () => {
        const t = document.getElementById('e_type').value;
        document.getElementById('e_norm_sec').style.display = t==='normal'?'block':'none';
        document.getElementById('e_prem_sec').style.display = t==='premium'?'block':'none';
    };
    window.saveEdit = () => {
        const id = document.getElementById('e_id').value;
        const up = { name:document.getElementById('e_title').value, description:document.getElementById('e_desc').value, thumbnail:document.getElementById('e_thumb').value, type:document.getElementById('e_type').value, ads_count:parseInt(document.getElementById('e_ads_c').value)||0, ads_time:parseInt(document.getElementById('e_ads_t').value)||0, price:parseInt(document.getElementById('e_price').value)||0 };
        update(ref(db, `files/${id}`), up).then(() => { alert("Updated!"); closeEdit(); });
    };
    window.closeEdit = () => document.getElementById('edit-modal').style.display='none';
    window.addLRow = () => {
        const div = document.createElement('div'); div.className = 'link-row'; div.style = 'display:flex; gap:10px; margin-bottom:10px;';
        div.innerHTML = `<input type="text" class="ln glass-input" placeholder="Name" style="flex:1; margin:0;"><input type="text" class="lu glass-input" placeholder="URL" style="flex:2; margin:0;"><button onclick="this.parentElement.remove()" style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-weight:bold; padding:0 5px;"><i class="fas fa-times"></i></button>`;
        document.getElementById('multi-link-area').appendChild(div);
    };
</script>

<script>
    function navTo(id, el) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active-section'); el.classList.add('active');
    }
    const bg = document.getElementById('stars-bg');
    for(let i=0; i<45; i++) {
        let s = document.createElement('div'); s.className = 'star';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.setProperty('--duration', (Math.random()*3+2)+'s'); bg.appendChild(s);
    }
</script>
</body>
</html>
